<div class="full-screen-bg min-h-screen bg-cover bg-center bg-fixed overflow-y-auto">

    <!-- Main 2 Column Layout -->
    <div class="min-h-screen grid grid-cols-1 md:grid-cols-[30%_70%]">

        <!-- ================= LEFT SECTION ================= -->
        <div class="flex flex-col  pl-10 md:pl-20 py-10">

            <!-- Logo -->
            <div>
                <h1 class="text-3xl sm:text-4xl font-black text-orange-500">
                    🍔 FastFood
                </h1>

                <p class="text-sm text-gray-500 pl-20">
                    Ordering System
                </p>
            </div>

            <div class="mt-20 pl-10">
                <p class="text-xl sm:text-2xl font-bold text-white">
                    Delicious Food,
                </p>

                <p class="text-xl sm:text-2xl font-bold text-orange-500">
                    Delivered Fast!
                </p>

                <p class="text-sm text-gray-300 mt-2 max-w-md">
                    Order your favorite fast food from top restaurants
                    and get it delivered to your doorstep.
                </p>
            </div>

        </div>


        <!-- ================= RIGHT SECTION ================= -->
        <div class="flex items-center justify-center px-10 py-8">

            <div
                class="bg-white p-6 sm:p-8 rounded-2xl shadow-2xl
                       w-full max-w-md sm:max-w-lg md:max-w-xl
                       max-h-[90vh] overflow-y-auto">


                <h3 class="text-lg font-bold text-center mb-2">
                    <span class="text-orange-500">Create</span> your account
                </h3>

                <p class="text-sm text-gray-500 mb-4 text-center">
                    Join FastFood Ordering System and get started
                </p>


                <!-- Sign Up As -->
                <div class="mb-4">

                    <label class="block text-sm font-semibold text-black mb-2">
                        Sign up as
                    </label>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">

                        <button
                            class="border-2 border-gray-300 rounded-lg p-3 text-center
                                   hover:border-orange-500 hover:bg-orange-50 transition">

                            <div class="font-semibold text-gray-700">
                                Admin
                            </div>

                            <div class="text-xs text-gray-500">
                                Manage shop, items and orders
                            </div>

                        </button>


                        <button
                            class="border-2 border-gray-300 rounded-lg p-3 text-center
                                   hover:border-orange-500 hover:bg-orange-50 transition">

                            <div class="font-semibold text-gray-700">
                                Employee
                            </div>

                            <div class="text-xs text-gray-500">
                                Deliver orders to customers
                            </div>

                        </button>


                        <button
                            class="border-2 border-orange-500 bg-orange-50
                                   rounded-lg p-3 text-center">

                            <div class="font-semibold text-orange-500">
                                Customer
                            </div>

                            <div class="text-xs text-gray-500">
                                Order food and get it delivered
                            </div>

                        </button>

                    </div>

                </div>


                <!-- FORM -->
                <form>

                    <!-- First Name / Last Name -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">
                                First Name
                            </label>

                            <input
                                type="text"
                                placeholder="Enter first name"
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg
                                       focus:ring-2 focus:ring-orange-500
                                       focus:border-orange-500 outline-none transition">
                        </div>


                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">
                                Last Name
                            </label>

                            <input
                                type="text"
                                placeholder="Enter last name"
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg
                                       focus:ring-2 focus:ring-orange-500
                                       focus:border-orange-500 outline-none transition">
                        </div>

                    </div>


                    <!-- Email -->
                    <div class="mt-3">

                        <label class="block text-sm font-semibold text-gray-700 mb-1">
                            Email
                        </label>

                        <input
                            type="email"
                            placeholder="Enter email address"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg
                                   focus:ring-2 focus:ring-orange-500
                                   focus:border-orange-500 outline-none transition">

                    </div>


                    <!-- Mobile -->
                    <div class="mt-3">

                        <label class="block text-sm font-semibold text-gray-700 mb-1">
                            Mobile Number
                        </label>

                        <input
                            type="tel"
                            placeholder="Enter mobile number"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg
                                   focus:ring-2 focus:ring-orange-500
                                   focus:border-orange-500 outline-none transition">

                    </div>


                    <!-- Password -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-3">

                        <div>

                            <label class="block text-sm font-semibold text-gray-700 mb-1">
                                Password
                            </label>

                            <input
                                type="password"
                                placeholder="Create a password"
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg
                                       focus:ring-2 focus:ring-orange-500
                                       focus:border-orange-500 outline-none transition">

                        </div>


                        <div>

                            <label class="block text-sm font-semibold text-gray-700 mb-1">
                                Confirm Password
                            </label>

                            <input
                                type="password"
                                placeholder="Confirm your password"
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg
                                       focus:ring-2 focus:ring-orange-500
                                       focus:border-orange-500 outline-none transition">

                        </div>

                    </div>


                    <!-- Location -->
                    <div class="mt-3">

                        <label class="block text-sm font-semibold text-gray-700 mb-1">
                            Location (for delivery)
                        </label>

                        <input
                            type="text"
                            placeholder="Enter your location"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg
                                   focus:ring-2 focus:ring-orange-500
                                   focus:border-orange-500 outline-none transition">

                    </div>


                    <!-- Checkboxes -->
                    <div class="mt-4 space-y-2">

                        <label class="flex items-center gap-2 cursor-pointer">

                            <input
                                type="checkbox"
                                class="w-4 h-4 text-orange-500 border-gray-300
                                       rounded focus:ring-orange-500">

                            <span class="text-sm text-gray-600">
                                Use My Location
                            </span>

                        </label>


                        <label class="flex items-center gap-2 cursor-pointer">

                            <input
                                type="checkbox"
                                class="w-4 h-4 text-orange-500 border-gray-300
                                       rounded focus:ring-orange-500">

                            <span class="text-sm text-gray-600">

                                I agree to the

                                <a href="#" class="text-orange-500 hover:underline">
                                    Terms & Conditions
                                </a>

                                and

                                <a href="#" class="text-orange-500 hover:underline">
                                    Privacy Policy
                                </a>

                            </span>

                        </label>

                    </div>


                    <!-- Sign Up -->
                    <button
                        type="submit"
                        class="w-full mt-6 bg-orange-500 hover:bg-orange-600
                               text-white font-bold py-3 rounded-lg
                               transition duration-300 shadow-lg hover:shadow-xl">

                        Sign Up

                    </button>

                </form>


                <!-- Login -->
                <p class="text-center text-sm text-gray-600 mt-4">

                    Already have an account?

                    <a href="#" class="text-orange-500 font-semibold hover:underline">
                        Login
                    </a>

                </p>

            </div>

        </div>

    </div>

</div>
